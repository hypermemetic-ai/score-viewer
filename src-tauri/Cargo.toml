[package]
name = "iso-score-viewer"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
# Unify Tauri codegen's host encoder with the frozen probe on every native host.
brotli = { version = "=9.0.0", features = ["portable-float"] }
sha2 = "=0.10.9"
serde_json = "1"
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"
sha2 = "=0.10.9"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
fs2 = "=0.4.3"
[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
midir = "0.11"
# The exact WebView2 bindings Tauri already uses; required for PrintToPdf.
webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
midir = "0.11"
# 0.16 uses HAL output without the newer process-tap/loopback deployment floor.
# Keep this exact until a native minimum-OS run validates an upgrade.
cpal = "=0.16.0"
